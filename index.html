<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Roll dice for Dungeons & Dragons - shake and throw virtual dice">
  <title>D&D Dice Roller</title>

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#6366f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dice Roller">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="./icons/icon-512.png">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #581c87, #312e81, #1e3a8a);
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 1rem;
    }

    .container { max-width: 56rem; margin: 0 auto; }

    /* Mute button */
    .mute-btn {
      position: fixed; top: 1rem; right: 1rem;
      background: rgba(255,255,255,0.2); border: none; color: #fff;
      border-radius: 9999px; padding: 0.75rem; font-size: 1.5rem;
      cursor: pointer; z-index: 50; line-height: 1;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      transition: background 0.2s;
    }
    .mute-btn:hover { background: rgba(255,255,255,0.3); }

    /* Header */
    .header { text-align: center; margin-bottom: 2rem; padding-top: 2rem; }
    .header-row { display: flex; align-items: center; justify-content: center; gap: 0.75rem; margin-bottom: 0.5rem; }
    .header-row .dice-icon { font-size: 2.5rem; }
    .header h1 { font-size: 2rem; font-weight: 700; }
    .header .subtitle { color: #c4b5fd; font-size: 0.875rem; }
    .header .motion-status { color: #86efac; font-size: 0.75rem; margin-top: 0.5rem; }

    /* Card / Screen */
    .card {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border-radius: 1rem; padding: 1.5rem; margin-bottom: 1.5rem;
    }
    .card h2 { font-size: 1.25rem; font-weight: 600; margin-bottom: 1rem; }

    /* Screen transitions */
    .screen {
      transition: opacity 0.3s ease, transform 0.3s ease;
      opacity: 1; transform: translateY(0);
    }
    .screen.hidden {
      display: none;
      opacity: 0; transform: translateY(12px);
    }
    .screen.fade-out {
      opacity: 0; transform: translateY(-8px);
      pointer-events: none;
    }
    .screen.fade-in {
      opacity: 0; transform: translateY(12px);
    }

    /* Dice type grid */
    .dice-grid {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 0.5rem; margin-bottom: 1.5rem;
    }
    @media (min-width: 768px) { .dice-grid { grid-template-columns: repeat(7, 1fr); } }
    .dice-type-btn {
      background: linear-gradient(135deg, #a855f7, #ec4899);
      border: none; color: #fff; border-radius: 0.75rem;
      padding: 0.75rem; font-weight: 700; font-size: 1rem;
      cursor: pointer; transition: transform 0.15s, filter 0.15s;
    }
    .dice-type-btn:hover { transform: scale(1.05); filter: brightness(0.9); }

    /* Selected dice */
    .selected-label { font-size: 1rem; font-weight: 600; margin-bottom: 0.75rem; }
    .selected-list { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.5rem; }
    .selected-chip {
      background: rgba(255,255,255,0.2); padding: 0.5rem 1rem;
      border-radius: 0.5rem; display: flex; align-items: center; gap: 0.5rem;
    }
    .remove-btn {
      background: none; border: none; color: #fca5a5;
      font-weight: 700; font-size: 1.1rem; cursor: pointer; padding: 0 0.25rem;
    }
    .remove-btn:hover { color: #fef2f2; }

    /* Action buttons */
    .actions { display: flex; flex-direction: column; gap: 0.75rem; }
    @media (min-width: 640px) { .actions { flex-direction: row; } }
    .btn-primary {
      flex: 1; border: none; color: #fff; font-weight: 700;
      padding: 0.875rem 1.5rem; border-radius: 0.75rem;
      font-size: 1.125rem; cursor: pointer;
      transition: transform 0.15s, filter 0.15s;
    }
    .btn-primary:hover { transform: scale(1.05); filter: brightness(0.9); }
    .btn-green { background: linear-gradient(to right, #22c55e, #059669); }
    .btn-orange { background: linear-gradient(to right, #f97316, #dc2626); }
    .btn-hint { display: block; font-size: 0.75rem; margin-top: 0.25rem; opacity: 0.75; }
    .btn-secondary {
      background: rgba(255,255,255,0.2); border: none; color: #fff;
      font-weight: 600; padding: 0.875rem 1.25rem; border-radius: 0.75rem;
      cursor: pointer; transition: background 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.3); }

    /* Shaking state */
    .shake-area { text-align: center; }
    .shake-icon {
      font-size: 5rem; display: inline-block;
      animation: bounce 0.6s infinite alternate ease-in-out;
    }
    .shake-icon-inner { display: inline-block; animation: shake 0.3s infinite; }
    .shake-hint { font-size: 0.875rem; color: #a78bfa; margin-bottom: 1.5rem; }

    /* Rolling / result cards */
    .results-grid {
      display: grid; grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem; margin-bottom: 1.5rem;
    }
    @media (min-width: 768px) { .results-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 1024px) { .results-grid { grid-template-columns: repeat(4, 1fr); } }

    .result-card {
      color: #111827; border-radius: 0.75rem; padding: 1.25rem;
      text-align: center; opacity: 0; transform: scale(0.5) rotate(-180deg);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    .result-card.settled {
      opacity: 1; transform: scale(1) rotate(0deg);
    }
    .result-card.cycling {
      opacity: 1; transform: scale(1) rotate(0deg);
    }
    .result-card .die-label { font-size: 0.75rem; font-weight: 600; opacity: 0.75; margin-bottom: 0.25rem; }
    .result-card .die-value { font-size: 2rem; font-weight: 700; transition: transform 0.08s; }
    .result-card .die-value.tick { transform: scale(1.15); }
    .result-card .die-value.pulse { animation: pulse 1s infinite; }
    .result-card .nat-label { font-size: 0.875rem; font-weight: 700; margin-top: 0.25rem; }

    /* Per-die-type colors */
    .die-color-4   { background: linear-gradient(135deg, #60a5fa, #3b82f6); }
    .die-color-6   { background: linear-gradient(135deg, #34d399, #10b981); }
    .die-color-8   { background: linear-gradient(135deg, #a78bfa, #8b5cf6); }
    .die-color-10  { background: linear-gradient(135deg, #f472b6, #ec4899); }
    .die-color-12  { background: linear-gradient(135deg, #fb923c, #f97316); }
    .die-color-20  { background: linear-gradient(135deg, #facc15, #eab308); }
    .die-color-100 { background: linear-gradient(135deg, #f87171, #ef4444); }

    /* Nat 20 glow */
    .result-card.nat20 {
      background: linear-gradient(135deg, #fde68a, #f59e0b, #f97316) !important;
      box-shadow: 0 0 24px rgba(234, 179, 8, 0.6);
      animation: nat20glow 1.5s ease-in-out infinite alternate;
    }
    @keyframes nat20glow {
      from { box-shadow: 0 0 16px rgba(234, 179, 8, 0.4); }
      to { box-shadow: 0 0 32px rgba(234, 179, 8, 0.8); }
    }

    /* Nat 1 doom */
    .result-card.nat1 {
      background: linear-gradient(135deg, #6b7280, #374151, #111827) !important;
      color: #f87171;
      box-shadow: 0 0 20px rgba(220, 38, 38, 0.4);
      animation: nat1pulse 1.5s ease-in-out infinite alternate;
    }
    @keyframes nat1pulse {
      from { box-shadow: 0 0 12px rgba(220, 38, 38, 0.3); }
      to { box-shadow: 0 0 28px rgba(220, 38, 38, 0.6); }
    }

    .total-card {
      background: rgba(255,255,255,0.2); border-radius: 0.75rem;
      padding: 1.25rem; text-align: center; margin-bottom: 1.5rem;
      opacity: 0; transition: opacity 0.4s ease 0.2s;
    }
    .total-card.visible { opacity: 1; }
    .total-label { font-size: 1rem; font-weight: 600; margin-bottom: 0.25rem; }
    .total-value { font-size: 3rem; font-weight: 700; }

    .text-center { text-align: center; }

    /* Animations */
    @keyframes shake {
      0%, 100% { transform: rotate(-8deg); }
      50% { transform: rotate(8deg); }
    }
    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-12px); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    @media (min-width: 640px) {
      .header-row .dice-icon { font-size: 3.5rem; }
      .header h1 { font-size: 3rem; }
      .header .subtitle { font-size: 1rem; }
      .card { padding: 2rem; }
      .card h2 { font-size: 1.5rem; }
      .dice-type-btn { padding: 1rem; font-size: 1.125rem; }
      .shake-icon { font-size: 6rem; }
      .result-card { padding: 1.5rem; }
      .result-card .die-value { font-size: 2.5rem; }
      .total-value { font-size: 3.5rem; }
    }

    .hidden { display: none; }
  </style>
</head>
<body>
  <button class="mute-btn" id="muteBtn" aria-label="Mute">&#x1f50a;</button>

  <div class="container">
    <div class="header">
      <div class="header-row">
        <span class="dice-icon">&#x1f3b2;</span>
        <h1>Dice Roller</h1>
      </div>
      <p class="subtitle">Select dice and shake to roll!</p>
      <p class="motion-status hidden" id="motionStatus">Shake detection enabled</p>
    </div>

    <!-- Select screen -->
    <div class="card screen" id="selectScreen">
      <h2>Select Your Dice</h2>
      <div class="dice-grid" id="diceGrid"></div>
      <div class="hidden" id="selectedSection">
        <p class="selected-label">Selected Dice:</p>
        <div class="selected-list" id="selectedList"></div>
      </div>
      <div class="actions hidden" id="selectActions">
        <button class="btn-primary btn-green" id="startShakeBtn">
          Start Shaking
          <span class="btn-hint">(Space/Enter)</span>
        </button>
        <button class="btn-secondary" id="resetBtn">Reset</button>
      </div>
    </div>

    <!-- Shake screen -->
    <div class="card screen hidden" id="shakeScreen">
      <div class="shake-area">
        <div class="shake-icon"><span class="shake-icon-inner">&#x1f3b2;</span></div>
        <h2>Shaking...</h2>
        <p class="shake-hint" id="shakeHint">Tap THROW when ready</p>
        <button class="btn-primary btn-orange" id="throwBtn">
          THROW!
          <span class="btn-hint">(Space/Enter)</span>
        </button>
      </div>
    </div>

    <!-- Rolling screen (cards with cycling numbers) -->
    <div class="card screen hidden" id="rollingScreen">
      <h2 class="text-center">Rolling...</h2>
      <div class="results-grid" id="rollingGrid"></div>
    </div>

    <!-- Results screen -->
    <div class="card screen hidden" id="resultsScreen">
      <h2 class="text-center">Results</h2>
      <div class="results-grid" id="resultsGrid"></div>
      <div class="total-card" id="totalCard">
        <div class="total-label">Total</div>
        <div class="total-value" id="totalValue"></div>
      </div>
      <div class="actions">
        <button class="btn-primary btn-green" id="rollAgainBtn">
          Roll These Again
          <span class="btn-hint">(Space/Enter)</span>
        </button>
        <button class="btn-secondary" id="reconfigureBtn">Reconfigure</button>
      </div>
    </div>
  </div>

  <script>
    // ── State ──
    const DICE_TYPES = [4, 6, 8, 10, 12, 20, 100];
    let diceConfig = [];
    let nextId = 0;
    let isMuted = false;
    let hasMotionPermission = localStorage.getItem('motionPermission') === 'granted';
    let shakeIntervalId = null;
    let lastShakeTime = 0;
    let state = 'select'; // select | shaking | rolling | results

    // ── DOM refs ──
    const $ = (id) => document.getElementById(id);
    const muteBtn = $('muteBtn');
    const motionStatus = $('motionStatus');
    const selectScreen = $('selectScreen');
    const diceGrid = $('diceGrid');
    const selectedSection = $('selectedSection');
    const selectedList = $('selectedList');
    const selectActions = $('selectActions');
    const startShakeBtn = $('startShakeBtn');
    const resetBtn = $('resetBtn');
    const shakeScreen = $('shakeScreen');
    const shakeHint = $('shakeHint');
    const throwBtn = $('throwBtn');
    const rollingScreen = $('rollingScreen');
    const rollingGrid = $('rollingGrid');
    const resultsScreen = $('resultsScreen');
    const resultsGrid = $('resultsGrid');
    const totalCard = $('totalCard');
    const totalValue = $('totalValue');
    const rollAgainBtn = $('rollAgainBtn');
    const reconfigureBtn = $('reconfigureBtn');

    const screens = [selectScreen, shakeScreen, rollingScreen, resultsScreen];
    const screenMap = { select: selectScreen, shaking: shakeScreen, rolling: rollingScreen, results: resultsScreen };

    // ── Audio (Web Audio API) ──
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      return audioCtx;
    }

    function playShake() {
      if (isMuted) return;
      const ctx = getAudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const filter = ctx.createBiquadFilter();
      osc.type = 'sine';
      osc.frequency.value = 400 + Math.random() * 300;
      filter.type = 'bandpass'; filter.frequency.value = 600; filter.Q.value = 2;
      osc.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
      gain.gain.setValueAtTime(0.05, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
      osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.08);
    }

    function playThrow() {
      if (isMuted) return;
      const ctx = getAudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.setValueAtTime(400, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.3);
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
      osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.3);
    }

    function playResult() {
      if (isMuted) return;
      const ctx = getAudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.setValueAtTime(800, ctx.currentTime);
      osc.frequency.setValueAtTime(1000, ctx.currentTime + 0.05);
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
      osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.2);
    }

    function playNat20() {
      if (isMuted) return;
      const ctx = getAudioCtx();
      [523.25, 659.25, 783.99].forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = freq; osc.type = 'sine';
        const t = ctx.currentTime + i * 0.15;
        gain.gain.setValueAtTime(0.2, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
        osc.start(t); osc.stop(t + 0.3);
      });
    }

    function playNat1() {
      if (isMuted) return;
      const ctx = getAudioCtx();
      // Descending sad trombone: Bb3 -> A3 -> Ab3
      [233.08, 220.00, 207.65].forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = freq; osc.type = 'sawtooth';
        const t = ctx.currentTime + i * 0.25;
        gain.gain.setValueAtTime(0.12, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.4);
        osc.start(t); osc.stop(t + 0.4);
      });
    }

    // ── Haptic feedback ──
    function vibrate(pattern) {
      if (navigator.vibrate) navigator.vibrate(pattern);
    }

    // ── Cryptographic random dice roll ──
    function rollDie(sides) {
      const max = Math.floor(0xFFFFFFFF / sides) * sides;
      const arr = new Uint32Array(1);
      let val;
      do { crypto.getRandomValues(arr); val = arr[0]; } while (val >= max);
      return (val % sides) + 1;
    }

    // ── Screen transitions ──
    //
    //  Crossfade: fade current screen out, swap display, fade new screen in.
    //  Total transition time: ~350ms (150 out + 200 in).
    //
    function showScreen(name) {
      const prev = state;
      state = name;

      if (prev === name) {
        // Just ensure visibility
        screens.forEach(s => {
          s.classList.toggle('hidden', s !== screenMap[name]);
          s.classList.remove('fade-out', 'fade-in');
        });
        return;
      }

      const outEl = screenMap[prev];
      const inEl = screenMap[name];

      // Fade out current
      if (outEl && !outEl.classList.contains('hidden')) {
        outEl.classList.add('fade-out');
      }

      setTimeout(() => {
        // Hide all, show target
        screens.forEach(s => {
          s.classList.add('hidden');
          s.classList.remove('fade-out');
        });
        inEl.classList.remove('hidden');
        inEl.classList.add('fade-in');

        // Force reflow then remove fade-in to trigger transition
        void inEl.offsetHeight;
        requestAnimationFrame(() => {
          inEl.classList.remove('fade-in');
        });
      }, 150);
    }

    // ── Die color class ──
    function dieColorClass(sides) {
      return 'die-color-' + sides;
    }

    // ── Render selected dice chips ──
    function renderSelected() {
      const hasAny = diceConfig.length > 0;
      selectedSection.classList.toggle('hidden', !hasAny);
      selectActions.classList.toggle('hidden', !hasAny);

      selectedList.innerHTML = '';
      diceConfig.forEach(d => {
        const chip = document.createElement('div');
        chip.className = 'selected-chip';
        chip.innerHTML = '<span>d' + d.sides + '</span>';
        const btn = document.createElement('button');
        btn.className = 'remove-btn';
        btn.textContent = '\u00d7';
        btn.onclick = () => { diceConfig = diceConfig.filter(x => x.id !== d.id); renderSelected(); };
        chip.appendChild(btn);
        selectedList.appendChild(chip);
      });
    }

    // ── Actions ──
    async function startShaking() {
      if (diceConfig.length === 0) return;

      // Request motion permission from user gesture (required on iOS)
      if (typeof DeviceMotionEvent !== 'undefined' &&
          typeof DeviceMotionEvent.requestPermission === 'function' &&
          !hasMotionPermission) {
        try {
          const perm = await DeviceMotionEvent.requestPermission();
          hasMotionPermission = perm === 'granted';
          if (hasMotionPermission) {
            localStorage.setItem('motionPermission', 'granted');
            motionStatus.classList.remove('hidden');
            shakeHint.textContent = 'Shake your phone to roll!';
          }
        } catch (_) {}
      }

      showScreen('shaking');
      shakeIntervalId = setInterval(playShake, 150);
    }

    function throwDice() {
      if (state !== 'shaking') return;
      clearInterval(shakeIntervalId);
      shakeIntervalId = null;

      playThrow();
      vibrate(100);

      // Pre-roll the actual results
      const finalResults = diceConfig.map(d => ({
        sides: d.sides, result: rollDie(d.sides), id: d.id
      }));

      // Build rolling cards with cycling numbers
      rollingGrid.innerHTML = '';
      const cards = finalResults.map((r, i) => {
        const card = document.createElement('div');
        card.className = 'result-card cycling ' + dieColorClass(r.sides);
        card.innerHTML =
          '<div class="die-label">d' + r.sides + '</div>' +
          '<div class="die-value">-</div>';
        rollingGrid.appendChild(card);

        // Stagger the appearance
        setTimeout(() => { card.classList.add('settled'); }, i * 60);

        return { el: card, valueEl: card.querySelector('.die-value'), final: r };
      });

      showScreen('rolling');

      // Cycle random numbers on each card
      const cycleInterval = setInterval(() => {
        cards.forEach(c => {
          if (!c.done) {
            const fake = rollDie(c.final.sides);
            c.valueEl.textContent = fake;
            c.valueEl.classList.add('tick');
            setTimeout(() => c.valueEl.classList.remove('tick'), 40);
          }
        });
      }, 70);

      // Settle each card one by one with staggered timing
      const settleDelay = Math.min(200, 1200 / cards.length);
      const settleStart = 600;

      cards.forEach((c, i) => {
        setTimeout(() => {
          c.done = true;
          c.valueEl.textContent = c.final.result;
          c.valueEl.classList.add('tick');
          setTimeout(() => c.valueEl.classList.remove('tick'), 80);
          vibrate(30);
        }, settleStart + i * settleDelay);
      });

      // After all settled, transition to results
      const totalTime = settleStart + cards.length * settleDelay + 300;
      setTimeout(() => {
        clearInterval(cycleInterval);
        showResults(finalResults);
      }, totalTime);
    }

    function showResults(results) {
      resultsGrid.innerHTML = '';
      let total = 0;
      const hasNat20 = results.some(r => r.sides === 20 && r.result === 20);
      const hasNat1 = results.some(r => r.sides === 20 && r.result === 1);

      results.forEach((r, i) => {
        total += r.result;
        const isNat20 = r.sides === 20 && r.result === 20;
        const isNat1 = r.sides === 20 && r.result === 1;

        const card = document.createElement('div');
        let cls = 'result-card ' + dieColorClass(r.sides);
        if (isNat20) cls = 'result-card nat20';
        if (isNat1) cls = 'result-card nat1';
        card.className = cls;

        let valueClass = 'die-value';
        if (isNat20) valueClass += ' pulse';

        card.innerHTML =
          '<div class="die-label">d' + r.sides + '</div>' +
          '<div class="' + valueClass + '">' + r.result + '</div>' +
          (isNat20 ? '<div class="nat-label">NAT 20!</div>' : '') +
          (isNat1 ? '<div class="nat-label">CRIT FAIL</div>' : '');
        resultsGrid.appendChild(card);

        // Stagger entrance
        setTimeout(() => card.classList.add('settled'), i * 80);
      });

      if (results.length > 1) {
        totalCard.style.display = '';
        totalValue.textContent = total;
        setTimeout(() => totalCard.classList.add('visible'), results.length * 80);
      } else {
        totalCard.style.display = 'none';
        totalCard.classList.remove('visible');
      }

      showScreen('results');

      // Sound + haptics after cards appear
      const soundDelay = results.length * 80 + 100;
      setTimeout(() => {
        if (hasNat20) { playNat20(); vibrate([100, 50, 100, 50, 200]); }
        else if (hasNat1) { playNat1(); vibrate([300, 100, 300]); }
        else { playResult(); vibrate(50); }
      }, soundDelay);
    }

    function rollAgain() {
      totalCard.classList.remove('visible');
      // Skip the shake screen — go straight to rolling
      state = 'shaking'; // throwDice() requires this
      throwDice();
    }

    function reconfigure() {
      diceConfig = [];
      if (shakeIntervalId) { clearInterval(shakeIntervalId); shakeIntervalId = null; }
      totalCard.classList.remove('visible');
      renderSelected();
      showScreen('select');
    }

    // ── Build dice type buttons ──
    DICE_TYPES.forEach(sides => {
      const btn = document.createElement('button');
      btn.className = 'dice-type-btn';
      btn.textContent = 'd' + sides;
      btn.onclick = () => { diceConfig.push({ sides, id: nextId++ }); renderSelected(); };
      diceGrid.appendChild(btn);
    });

    // ── Event listeners ──
    muteBtn.onclick = () => {
      isMuted = !isMuted;
      muteBtn.innerHTML = isMuted ? '&#x1f507;' : '&#x1f50a;';
      muteBtn.setAttribute('aria-label', isMuted ? 'Unmute' : 'Mute');
    };
    startShakeBtn.onclick = startShaking;
    resetBtn.onclick = reconfigure;
    throwBtn.onclick = throwDice;
    rollAgainBtn.onclick = rollAgain;
    reconfigureBtn.onclick = reconfigure;

    // Keyboard controls
    window.addEventListener('keydown', (e) => {
      if (e.code !== 'Space' && e.code !== 'Enter') return;
      e.preventDefault();
      if (state === 'select' && diceConfig.length > 0) startShaking();
      else if (state === 'shaking') throwDice();
      else if (state === 'results') rollAgain();
    });

    // ── Motion detection (non-iOS gets it automatically) ──
    if (typeof DeviceMotionEvent !== 'undefined') {
      if (typeof DeviceMotionEvent.requestPermission !== 'function' && window.DeviceMotionEvent) {
        // Android / older iOS: permission not required
        hasMotionPermission = true;
        motionStatus.classList.remove('hidden');
      } else if (hasMotionPermission) {
        // iOS: permission was previously granted (persisted in localStorage)
        motionStatus.classList.remove('hidden');
      }
      // iOS first-time permission is requested in startShaking() via user gesture
    }

    // Device shake detection
    window.addEventListener('devicemotion', (e) => {
      if (!hasMotionPermission) return;
      if (state !== 'shaking' && state !== 'results') return;
      const acc = e.accelerationIncludingGravity;
      if (!acc || acc.x === null || acc.y === null || acc.z === null) return;
      const mag = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);
      if (mag > 20) {
        const now = Date.now();
        if (now - lastShakeTime > 500) {
          if (state === 'results') rollAgain();
          else throwDice();
          lastShakeTime = now;
        }
      }
    });

    // ── Service Worker registration ──
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
</body>
</html>
