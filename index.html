<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Roll dice for Dungeons & Dragons - shake and throw virtual dice">
  <title>D&D Dice Roller</title>
  
  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#6366f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dice Roller">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="./icons/icon-512.png">
  
  <!-- React and Babel from CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    
    @keyframes shake {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(5deg); }
    }
    
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.5) rotate(-180deg);
      }
      to {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const DICE_TYPES = [4, 6, 8, 10, 12, 20, 100];

    // Web Audio API sound generator
    const useAudio = () => {
      const audioContextRef = useRef(null);

      const getContext = () => {
        if (!audioContextRef.current) {
          audioContextRef.current = new (window.AudioContext || window.webkitAudioContext)();
        }
        return audioContextRef.current;
      };

      const playShake = () => {
        const ctx = getContext();
        
        const oscillator = ctx.createOscillator();
        const gainNode = ctx.createGain();
        const filter = ctx.createBiquadFilter();
        
        oscillator.type = 'sine';
        oscillator.frequency.value = 400 + Math.random() * 300;
        
        filter.type = 'bandpass';
        filter.frequency.value = 600;
        filter.Q.value = 2;
        
        oscillator.connect(filter);
        filter.connect(gainNode);
        gainNode.connect(ctx.destination);
        
        gainNode.gain.setValueAtTime(0.05, ctx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
        
        oscillator.start(ctx.currentTime);
        oscillator.stop(ctx.currentTime + 0.08);
      };

      const playThrow = () => {
        const ctx = getContext();
        const oscillator = ctx.createOscillator();
        const gainNode = ctx.createGain();
        
        oscillator.connect(gainNode);
        gainNode.connect(ctx.destination);
        
        oscillator.frequency.setValueAtTime(400, ctx.currentTime);
        oscillator.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.3);
        gainNode.gain.setValueAtTime(0.2, ctx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
        
        oscillator.start(ctx.currentTime);
        oscillator.stop(ctx.currentTime + 0.3);
      };

      const playResult = () => {
        const ctx = getContext();
        const oscillator = ctx.createOscillator();
        const gainNode = ctx.createGain();
        
        oscillator.connect(gainNode);
        gainNode.connect(ctx.destination);
        
        oscillator.frequency.setValueAtTime(800, ctx.currentTime);
        oscillator.frequency.setValueAtTime(1000, ctx.currentTime + 0.05);
        gainNode.gain.setValueAtTime(0.15, ctx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
        
        oscillator.start(ctx.currentTime);
        oscillator.stop(ctx.currentTime + 0.2);
      };

      const playNat20 = () => {
        const ctx = getContext();
        // Play a triumphant three-note fanfare
        const notes = [523.25, 659.25, 783.99]; // C5, E5, G5
        
        notes.forEach((freq, i) => {
          const oscillator = ctx.createOscillator();
          const gainNode = ctx.createGain();
          
          oscillator.connect(gainNode);
          gainNode.connect(ctx.destination);
          
          oscillator.frequency.value = freq;
          oscillator.type = 'sine';
          
          const startTime = ctx.currentTime + (i * 0.15);
          gainNode.gain.setValueAtTime(0.2, startTime);
          gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + 0.3);
          
          oscillator.start(startTime);
          oscillator.stop(startTime + 0.3);
        });
      };

      return { playShake, playThrow, playResult, playNat20 };
    };

    function DiceRoller() {
      const [diceConfig, setDiceConfig] = useState([]);
      const [isShaking, setIsShaking] = useState(false);
      const [isRolling, setIsRolling] = useState(false);
      const [results, setResults] = useState([]);
      const [shakeDuration, setShakeDuration] = useState(0);
      const [hasMotionPermission, setHasMotionPermission] = useState(false);
      const [isMuted, setIsMuted] = useState(false);
      const shakeStartTime = useRef(null);
      const animationFrame = useRef(null);
      const lastShakeTime = useRef(0);
      const shakeIntervalRef = useRef(null);
      const { playShake, playThrow, playResult, playNat20 } = useAudio();

      // Request motion permission immediately on mount
      useEffect(() => {
        const requestPermission = async () => {
          if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
            try {
              const permission = await DeviceMotionEvent.requestPermission();
              setHasMotionPermission(permission === 'granted');
            } catch (error) {
              console.log('Motion permission denied or error:', error);
              setHasMotionPermission(false);
            }
          } else if (window.DeviceMotionEvent) {
            setHasMotionPermission(true);
          }
        };
        
        requestPermission();
      }, []);

      // Handle device motion (shake detection)
      useEffect(() => {
        if (!hasMotionPermission || !isShaking) return;

        const handleMotion = (event) => {
          const acc = event.accelerationIncludingGravity;
          if (!acc || acc.x === null || acc.y === null || acc.z === null) return;

          const magnitude = Math.sqrt(
            acc.x * acc.x + acc.y * acc.y + acc.z * acc.z
          );

          console.log('Shake magnitude:', magnitude.toFixed(2));

          // Detect a strong shake - this triggers the throw!
          if (magnitude > 20) {
            const now = Date.now();
            if (now - lastShakeTime.current > 500) {
              console.log('SHAKE TO THROW DETECTED!', magnitude.toFixed(2));
              throwDice();
              lastShakeTime.current = now;
            }
          }
        };

        window.addEventListener('devicemotion', handleMotion);
        return () => window.removeEventListener('devicemotion', handleMotion);
      }, [hasMotionPermission, isShaking, isMuted]);

      // Update shake duration
      useEffect(() => {
        if (isShaking) {
          shakeStartTime.current = Date.now();
          const updateDuration = () => {
            setShakeDuration(Date.now() - shakeStartTime.current);
            animationFrame.current = requestAnimationFrame(updateDuration);
          };
          animationFrame.current = requestAnimationFrame(updateDuration);
        } else {
          if (animationFrame.current) {
            cancelAnimationFrame(animationFrame.current);
          }
        }
        return () => {
          if (animationFrame.current) {
            cancelAnimationFrame(animationFrame.current);
          }
        };
      }, [isShaking]);

      // Keyboard controls
      useEffect(() => {
        const handleKeyPress = (e) => {
          if (e.code === 'Space' || e.code === 'Enter') {
            e.preventDefault();
            
            if (!isShaking && !isRolling && results.length === 0 && diceConfig.length > 0) {
              startShaking();
            } else if (isShaking) {
              throwDice();
            } else if (results.length > 0) {
              rollAgain();
            }
          }
        };

        window.addEventListener('keydown', handleKeyPress);
        return () => window.removeEventListener('keydown', handleKeyPress);
      }, [isShaking, isRolling, results, diceConfig]);

      const addDice = (sides) => {
        setDiceConfig([...diceConfig, { sides, id: Date.now() }]);
      };

      const removeDice = (id) => {
        setDiceConfig(diceConfig.filter(d => d.id !== id));
      };

      const startShaking = () => {
        setIsShaking(true);
        setResults([]);
        
        if (!isMuted) {
          shakeIntervalRef.current = setInterval(() => {
            playShake();
          }, 150);
        }
      };

      const throwDice = () => {
        setIsShaking(false);
        setIsRolling(true);
        
        if (shakeIntervalRef.current) {
          clearInterval(shakeIntervalRef.current);
          shakeIntervalRef.current = null;
        }
        
        if (!isMuted) playThrow();
        
        const seed = shakeDuration;
        
        setTimeout(() => {
          const newResults = diceConfig.map((dice, index) => {
            const random = Math.sin(seed * (index + 1) * 0.001) * 10000;
            const roll = Math.floor((Math.abs(random) % 1) * dice.sides) + 1;
            return { sides: dice.sides, result: roll, id: dice.id };
          });
          setResults(newResults);
          setIsRolling(false);
          
          // Check for nat 20!
          const hasNat20 = newResults.some(r => r.sides === 20 && r.result === 20);
          if (hasNat20 && !isMuted) {
            playNat20();
          } else if (!isMuted) {
            playResult();
          }
        }, 1000);
      };

      const rollAgain = () => {
        setResults([]);
        setShakeDuration(0);
        startShaking();
      };

      const reconfigure = () => {
        setDiceConfig([]);
        setResults([]);
        setShakeDuration(0);
        
        if (shakeIntervalRef.current) {
          clearInterval(shakeIntervalRef.current);
          shakeIntervalRef.current = null;
        }
      };

      // Cleanup shake interval on unmount
      useEffect(() => {
        return () => {
          if (shakeIntervalRef.current) {
            clearInterval(shakeIntervalRef.current);
          }
        };
      }, []);

      const total = results.reduce((sum, r) => sum + r.result, 0);

      return (
        <div className="min-h-screen bg-gradient-to-br from-purple-900 via-indigo-900 to-blue-900 text-white p-4">
          <div className="max-w-4xl mx-auto">
            {/* Mute button - always visible */}
            <button
              onClick={() => setIsMuted(!isMuted)}
              className="fixed top-4 right-4 bg-white/20 hover:bg-white/30 backdrop-blur rounded-full p-3 transition-all z-50 text-2xl"
              aria-label={isMuted ? 'Unmute' : 'Mute'}
            >
              {isMuted ? '🔇' : '🔊'}
            </button>

            <div className="text-center mb-8 pt-8">
              <div className="flex items-center justify-center gap-3 mb-2">
                <span className="text-4xl sm:text-6xl">🎲</span>
                <h1 className="text-3xl sm:text-5xl font-bold">Dice Roller</h1>
              </div>
              <p className="text-purple-200 text-sm sm:text-base">Select dice and shake to roll!</p>
              {hasMotionPermission && (
                <p className="text-green-300 text-xs sm:text-sm mt-2">📱 Shake detection enabled</p>
              )}
            </div>

            {!isShaking && !isRolling && results.length === 0 && (
              <div className="bg-white/10 backdrop-blur rounded-2xl p-4 sm:p-8 mb-6">
                <h2 className="text-xl sm:text-2xl font-semibold mb-4">Select Your Dice</h2>
                <div className="grid grid-cols-4 md:grid-cols-7 gap-2 sm:gap-3 mb-6">
                  {DICE_TYPES.map(sides => (
                    <button
                      key={sides}
                      onClick={() => addDice(sides)}
                      className="bg-gradient-to-br from-purple-500 to-pink-500 hover:from-purple-600 hover:to-pink-600 rounded-xl p-3 sm:p-4 font-bold text-base sm:text-lg transition-all transform hover:scale-105"
                    >
                      d{sides}
                    </button>
                  ))}
                </div>

                {diceConfig.length > 0 && (
                  <div className="mb-6">
                    <h3 className="text-base sm:text-lg font-semibold mb-3">Selected Dice:</h3>
                    <div className="flex flex-wrap gap-2">
                      {diceConfig.map(dice => (
                        <div
                          key={dice.id}
                          className="bg-white/20 px-4 py-2 rounded-lg flex items-center gap-2"
                        >
                          <span>d{dice.sides}</span>
                          <button
                            onClick={() => removeDice(dice.id)}
                            className="text-red-300 hover:text-red-100 font-bold"
                          >
                            ×
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {diceConfig.length > 0 && (
                  <div className="flex flex-col sm:flex-row gap-3">
                    <button
                      onClick={startShaking}
                      className="flex-1 bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-white font-bold py-3 sm:py-4 px-6 sm:px-8 rounded-xl text-lg sm:text-xl transition-all transform hover:scale-105"
                    >
                      Start Shaking
                      <span className="text-xs sm:text-sm block mt-1 opacity-75">(Space/Enter)</span>
                    </button>
                    <button
                      onClick={reconfigure}
                      className="bg-white/20 hover:bg-white/30 font-semibold py-3 sm:py-4 px-4 sm:px-6 rounded-xl transition-all"
                    >
                      Reset
                    </button>
                  </div>
                )}
              </div>
            )}

            {isShaking && (
              <div className="bg-white/10 backdrop-blur rounded-2xl p-4 sm:p-8 mb-6 text-center">
                <div className={`inline-block ${isShaking ? 'animate-bounce' : ''}`}>
                  <div 
                    className="text-6xl sm:text-8xl mx-auto mb-4"
                    style={{
                      animation: isShaking ? 'shake 0.3s infinite' : 'none'
                    }} 
                  >
                    🎲
                  </div>
                </div>
                <h2 className="text-2xl sm:text-3xl font-bold mb-2">Shaking...</h2>
                <p className="text-xl sm:text-2xl text-purple-200 mb-6">
                  {(shakeDuration / 1000).toFixed(1)}s
                </p>
                <p className="text-sm sm:text-base text-purple-300 mb-6">
                  {hasMotionPermission ? '🎲 Shake your phone to roll!' : 'Tap THROW when ready'}
                </p>
                <button
                  onClick={throwDice}
                  className="bg-gradient-to-r from-orange-500 to-red-600 hover:from-orange-600 hover:to-red-700 text-white font-bold py-3 sm:py-4 px-8 sm:px-12 rounded-xl text-xl sm:text-2xl transition-all transform hover:scale-105"
                >
                  THROW!
                  <span className="text-xs sm:text-sm block mt-1 opacity-75">(Space/Enter)</span>
                </button>
              </div>
            )}

            {isRolling && (
              <div className="bg-white/10 backdrop-blur rounded-2xl p-8 mb-6 text-center">
                <div className="inline-block animate-spin text-8xl">
                  🎲
                </div>
                <h2 className="text-3xl font-bold mt-4">Rolling...</h2>
              </div>
            )}

            {results.length > 0 && !isRolling && (
              <div className="bg-white/10 backdrop-blur rounded-2xl p-4 sm:p-8 mb-6">
                <h2 className="text-2xl sm:text-3xl font-bold mb-6 text-center">Results</h2>
                <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-4 mb-6">
                  {results.map((result, index) => {
                    const isNat20 = result.sides === 20 && result.result === 20;
                    return (
                      <div
                        key={result.id}
                        className={`${isNat20 
                          ? 'bg-gradient-to-br from-yellow-300 via-amber-400 to-orange-400 shadow-lg shadow-yellow-500/50' 
                          : 'bg-gradient-to-br from-yellow-400 to-orange-500'
                        } text-gray-900 rounded-xl p-4 sm:p-6 text-center transform transition-all`}
                        style={{
                          animation: `fadeIn 0.5s ease-out ${index * 0.1}s backwards`
                        }}
                      >
                        <div className="text-xs sm:text-sm font-semibold opacity-75 mb-1">
                          d{result.sides}
                        </div>
                        <div className={`text-3xl sm:text-4xl font-bold ${isNat20 ? 'animate-pulse' : ''}`}>
                          {result.result}
                          {isNat20 && <span className="block text-xl">🎉</span>}
                        </div>
                      </div>
                    );
                  })}
                </div>
                {results.length > 1 && (
                  <div className="bg-white/20 rounded-xl p-4 sm:p-6 text-center mb-6">
                    <div className="text-base sm:text-lg font-semibold mb-1">Total</div>
                    <div className="text-4xl sm:text-5xl font-bold">{total}</div>
                  </div>
                )}
                <div className="flex flex-col sm:flex-row gap-3">
                  <button
                    onClick={rollAgain}
                    className="flex-1 bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-white font-bold py-3 sm:py-4 px-6 sm:px-8 rounded-xl text-lg sm:text-xl transition-all transform hover:scale-105"
                  >
                    Roll These Again
                    <span className="text-xs sm:text-sm block mt-1 opacity-75">(Space/Enter)</span>
                  </button>
                  <button
                    onClick={reconfigure}
                    className="bg-white/20 hover:bg-white/30 font-semibold py-3 sm:py-4 px-4 sm:px-6 rounded-xl transition-all flex items-center justify-center gap-2"
                  >
                    <span className="text-lg">⚙️</span>
                    Reconfigure
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<DiceRoller />);
  </script>
</body>
</html>
