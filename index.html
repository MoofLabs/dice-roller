<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Roll dice - shake and throw virtual dice">
  <title>Dice Roller</title>
  
  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#6366f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dice Roller">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="./icons/icon-512.png">
  
  <!-- React and Babel from CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    
    @keyframes tumble {
      0% { transform: rotate(0deg) scale(1); }
      25% { transform: rotate(90deg) scale(1.1); }
      50% { transform: rotate(180deg) scale(1); }
      75% { transform: rotate(270deg) scale(1.1); }
      100% { transform: rotate(360deg) scale(1); }
    }
    
    .rolling-die {
      animation: tumble 1s linear infinite;
    }
    
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.5) rotate(-180deg);
      }
      to {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const DICE_TYPES = [4, 6, 8, 10, 12, 20, 100];

    // Dice face component
    const DiceFace = ({ sides, number, isRolling }) => {
      if (sides === 6) {
        // D6 with dots
        const dots = {
          1: [[1, 1]],
          2: [[0, 0], [2, 2]],
          3: [[0, 0], [1, 1], [2, 2]],
          4: [[0, 0], [0, 2], [2, 0], [2, 2]],
          5: [[0, 0], [0, 2], [1, 1], [2, 0], [2, 2]],
          6: [[0, 0], [0, 1], [0, 2], [2, 0], [2, 1], [2, 2]]
        };
        
        return (
          <div className="relative w-20 h-20 bg-white rounded-lg shadow-xl border-2 border-gray-300">
            <div className="absolute inset-0 grid grid-cols-3 grid-rows-3 p-2">
              {dots[number]?.map((pos, i) => (
                <div key={i} className="flex items-center justify-center" style={{gridColumn: pos[0] + 1, gridRow: pos[1] + 1}}>
                  <div className="w-3 h-3 bg-gray-900 rounded-full"></div>
                </div>
              ))}
            </div>
          </div>
        );
      }
      
      if (sides === 4) {
        // D4 as triangle
        return (
          <div className="relative w-20 h-20 flex items-center justify-center">
            <svg viewBox="0 0 100 100" className="w-full h-full">
              <polygon points="50,10 90,80 10,80" fill="white" stroke="#374151" strokeWidth="3"/>
              <text x="50" y="60" textAnchor="middle" className="text-2xl font-bold fill-gray-900">{number}</text>
            </svg>
          </div>
        );
      }
      
      if (sides === 8) {
        // D8 as diamond
        return (
          <div className="relative w-20 h-20 flex items-center justify-center">
            <svg viewBox="0 0 100 100" className="w-full h-full">
              <polygon points="50,5 90,50 50,95 10,50" fill="white" stroke="#374151" strokeWidth="3"/>
              <text x="50" y="60" textAnchor="middle" className="text-2xl font-bold fill-gray-900">{number}</text>
            </svg>
          </div>
        );
      }
      
      if (sides === 10 || sides === 100) {
        // D10 as kite shape
        return (
          <div className="relative w-20 h-20 flex items-center justify-center">
            <svg viewBox="0 0 100 100" className="w-full h-full">
              <polygon points="50,10 75,40 65,90 35,90 25,40" fill="white" stroke="#374151" strokeWidth="3"/>
              <text x="50" y="60" textAnchor="middle" className="text-2xl font-bold fill-gray-900">{number}</text>
            </svg>
          </div>
        );
      }
      
      if (sides === 12) {
        // D12 as pentagon
        return (
          <div className="relative w-20 h-20 flex items-center justify-center">
            <svg viewBox="0 0 100 100" className="w-full h-full">
              <polygon points="50,10 85,35 75,75 25,75 15,35" fill="white" stroke="#374151" strokeWidth="3"/>
              <text x="50" y="60" textAnchor="middle" className="text-2xl font-bold fill-gray-900">{number}</text>
            </svg>
          </div>
        );
      }
      
      if (sides === 20) {
        // D20 as hexagon
        return (
          <div className="relative w-20 h-20 flex items-center justify-center">
            <svg viewBox="0 0 100 100" className="w-full h-full">
              <polygon points="50,5 85,25 85,65 50,85 15,65 15,25" fill="white" stroke="#374151" strokeWidth="3"/>
              <text x="50" y="60" textAnchor="middle" className="text-2xl font-bold fill-gray-900">{number}</text>
            </svg>
          </div>
        );
      }
      
      return null;
    };

    // Rolling dice animation component
    const RollingDice = ({ dice }) => {
      const [currentNumbers, setCurrentNumbers] = useState(
        dice.map(d => Math.floor(Math.random() * d.sides) + 1)
      );
      
      useEffect(() => {
        const interval = setInterval(() => {
          setCurrentNumbers(dice.map(d => Math.floor(Math.random() * d.sides) + 1));
        }, 100);
        
        return () => clearInterval(interval);
      }, [dice]);
      
      return (
        <div className="flex flex-wrap justify-center gap-6 items-center min-h-[200px]">
          {dice.map((die, i) => (
            <div
              key={die.id}
              className="rolling-die"
              style={{
                animationDelay: `${i * 0.1}s`
              }}
            >
              <DiceFace sides={die.sides} number={currentNumbers[i]} isRolling={true} />
            </div>
          ))}
        </div>
      );
    };

    // Web Audio API sound generator
    const useAudio = () => {
      const audioContextRef = useRef(null);

      const getContext = () => {
        if (!audioContextRef.current) {
          audioContextRef.current = new (window.AudioContext || window.webkitAudioContext)();
        }
        return audioContextRef.current;
      };

      const playRoll = () => {
        const ctx = getContext();
        for (let i = 0; i < 8; i++) {
          const oscillator = ctx.createOscillator();
          const gainNode = ctx.createGain();
          const filter = ctx.createBiquadFilter();
          
          oscillator.type = 'sine';
          oscillator.frequency.value = 400 + Math.random() * 300;
          
          filter.type = 'bandpass';
          filter.frequency.value = 600;
          filter.Q.value = 2;
          
          oscillator.connect(filter);
          filter.connect(gainNode);
          gainNode.connect(ctx.destination);
          
          const startTime = ctx.currentTime + (i * 0.1);
          gainNode.gain.setValueAtTime(0.05, startTime);
          gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + 0.08);
          
          oscillator.start(startTime);
          oscillator.stop(startTime + 0.08);
        }
      };

      const playResult = () => {
        const ctx = getContext();
        const oscillator = ctx.createOscillator();
        const gainNode = ctx.createGain();
        
        oscillator.connect(gainNode);
        gainNode.connect(ctx.destination);
        
        oscillator.frequency.setValueAtTime(800, ctx.currentTime);
        oscillator.frequency.setValueAtTime(1000, ctx.currentTime + 0.05);
        gainNode.gain.setValueAtTime(0.15, ctx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
        
        oscillator.start(ctx.currentTime);
        oscillator.stop(ctx.currentTime + 0.2);
      };

      const playNat20 = () => {
        const ctx = getContext();
        const notes = [523.25, 659.25, 783.99];
        
        notes.forEach((freq, i) => {
          const oscillator = ctx.createOscillator();
          const gainNode = ctx.createGain();
          
          oscillator.connect(gainNode);
          gainNode.connect(ctx.destination);
          
          oscillator.frequency.value = freq;
          oscillator.type = 'sine';
          
          const startTime = ctx.currentTime + (i * 0.15);
          gainNode.gain.setValueAtTime(0.2, startTime);
          gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + 0.3);
          
          oscillator.start(startTime);
          oscillator.stop(startTime + 0.3);
        });
      };

      return { playRoll, playResult, playNat20 };
    };

    function DiceRoller() {
      const [diceConfig, setDiceConfig] = useState([]);
      const [isRolling, setIsRolling] = useState(false);
      const [results, setResults] = useState([]);
      const [isMuted, setIsMuted] = useState(false);
      const [hasMotionPermission, setHasMotionPermission] = useState(false);
      const lastShakeTime = useRef(0);
      const { playRoll, playResult, playNat20 } = useAudio();

      useEffect(() => {
        const requestPermission = async () => {
          if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
            // iOS 13+ - don't auto-request, wait for user action
            setHasMotionPermission(false);
          } else if (window.DeviceMotionEvent) {
            setHasMotionPermission(true);
          }
        };
        
        requestPermission();
      }, []);

      const enableShake = async () => {
        if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
          try {
            const permission = await DeviceMotionEvent.requestPermission();
            setHasMotionPermission(permission === 'granted');
            if (permission !== 'granted') {
              alert('Motion permission denied. You can still use the Roll button!');
            }
          } catch (error) {
            console.error('Permission error:', error);
            setHasMotionPermission(false);
          }
        }
      };

      useEffect(() => {
        if (!hasMotionPermission || diceConfig.length === 0 || isRolling || results.length > 0) return;

        const handleMotion = (event) => {
          const acc = event.accelerationIncludingGravity;
          if (!acc || acc.x === null || acc.y === null || acc.z === null) return;

          const magnitude = Math.sqrt(
            acc.x * acc.x + acc.y * acc.y + acc.z * acc.z
          );

          if (magnitude > 20) {
            const now = Date.now();
            if (now - lastShakeTime.current > 1000) {
              rollDice();
              lastShakeTime.current = now;
            }
          }
        };

        window.addEventListener('devicemotion', handleMotion);
        return () => window.removeEventListener('devicemotion', handleMotion);
      }, [hasMotionPermission, diceConfig, isRolling, results]);

      useEffect(() => {
        const handleKeyPress = (e) => {
          if (e.code === 'Space' || e.code === 'Enter') {
            e.preventDefault();
            
            if (!isRolling && results.length === 0 && diceConfig.length > 0) {
              rollDice();
            } else if (results.length > 0) {
              rollAgain();
            }
          }
        };

        window.addEventListener('keydown', handleKeyPress);
        return () => window.removeEventListener('keydown', handleKeyPress);
      }, [isRolling, results, diceConfig]);

      const addDice = (sides) => {
        setDiceConfig([...diceConfig, { sides, id: Date.now() + Math.random() }]);
      };

      const removeDice = (id) => {
        setDiceConfig(diceConfig.filter(d => d.id !== id));
      };

      const rollDice = () => {
        if (diceConfig.length === 0 || isRolling) return;
        
        setIsRolling(true);
        if (!isMuted) playRoll();
        
        const seed = Date.now() + Math.random() * 10000;
        
        setTimeout(() => {
          const newResults = diceConfig.map((dice, index) => {
            const random = Math.sin(seed * (index + 1) * 0.001) * 10000;
            const roll = Math.floor((Math.abs(random) % 1) * dice.sides) + 1;
            return { sides: dice.sides, result: roll, id: dice.id };
          });
          setResults(newResults);
          setIsRolling(false);
          
          const hasNat20 = newResults.some(r => r.sides === 20 && r.result === 20);
          
          if (hasNat20 && !isMuted) {
            playNat20();
          } else if (!isMuted) {
            playResult();
          }
        }, 2000);
      };

      const rollAgain = () => {
        setResults([]);
        rollDice();
      };

      const reconfigure = () => {
        setDiceConfig([]);
        setResults([]);
      };

      const total = results.reduce((sum, r) => sum + r.result, 0);
      
      const d6Results = results.filter(r => r.sides === 6);
      const isSnakeEyes = d6Results.length === 2 && 
                         d6Results.every(r => r.result === 1) &&
                         results.length === 2;

      return (
        <div className="min-h-screen bg-gradient-to-br from-purple-900 via-indigo-900 to-blue-900 text-white p-4">
          <div className="max-w-4xl mx-auto">
            <button
              onClick={() => setIsMuted(!isMuted)}
              className="fixed top-4 right-4 bg-white/20 hover:bg-white/30 backdrop-blur rounded-full p-3 transition-all z-50 text-2xl"
              aria-label={isMuted ? 'Unmute' : 'Mute'}
            >
              {isMuted ? '🔇' : '🔊'}
            </button>

            <div className="text-center mb-8 pt-8">
              <div className="flex items-center justify-center gap-3 mb-2">
                <span className="text-4xl sm:text-6xl">🎲</span>
                <h1 className="text-3xl sm:text-5xl font-bold">Dice Roller</h1>
              </div>
              <p className="text-purple-200 text-sm sm:text-base">Select dice and roll!</p>
              {!hasMotionPermission && typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function' && (
                <button
                  onClick={enableShake}
                  className="mt-3 bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition-all"
                >
                  📱 Enable Shake to Roll
                </button>
              )}
              {hasMotionPermission && (
                <p className="text-green-300 text-xs sm:text-sm mt-2">📱 Shake enabled!</p>
              )}
            </div>

            {!isRolling && results.length === 0 && (
              <div className="bg-white/10 backdrop-blur rounded-2xl p-4 sm:p-8 mb-6">
                <h2 className="text-xl sm:text-2xl font-semibold mb-4">Select Your Dice</h2>
                <div className="grid grid-cols-4 md:grid-cols-7 gap-2 sm:gap-3 mb-6">
                  {DICE_TYPES.map(sides => (
                    <button
                      key={sides}
                      onClick={() => addDice(sides)}
                      className="bg-gradient-to-br from-purple-500 to-pink-500 hover:from-purple-600 hover:to-pink-600 rounded-xl p-3 sm:p-4 font-bold text-base sm:text-lg transition-all transform hover:scale-105"
                    >
                      d{sides}
                    </button>
                  ))}
                </div>

                {diceConfig.length > 0 && (
                  <div className="mb-6">
                    <h3 className="text-base sm:text-lg font-semibold mb-3">Selected Dice:</h3>
                    <div className="flex flex-wrap gap-2">
                      {diceConfig.map(dice => (
                        <div
                          key={dice.id}
                          className="bg-white/20 px-4 py-2 rounded-lg flex items-center gap-2"
                        >
                          <span>d{dice.sides}</span>
                          <button
                            onClick={() => removeDice(dice.id)}
                            className="text-red-300 hover:text-red-100 font-bold"
                          >
                            ×
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {diceConfig.length > 0 && (
                  <div className="flex flex-col sm:flex-row gap-3">
                    <button
                      onClick={rollDice}
                      className="flex-1 bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-white font-bold py-3 sm:py-4 px-6 sm:px-8 rounded-xl text-lg sm:text-xl transition-all transform hover:scale-105"
                    >
                      Roll Dice!
                      <span className="text-xs sm:text-sm block mt-1 opacity-75">(Space/Enter)</span>
                    </button>
                    <button
                      onClick={reconfigure}
                      className="bg-white/20 hover:bg-white/30 font-semibold py-3 sm:py-4 px-4 sm:px-6 rounded-xl transition-all"
                    >
                      Reset
                    </button>
                  </div>
                )}
              </div>
            )}

            {isRolling && (
              <div className="bg-white/10 backdrop-blur rounded-2xl p-8 mb-6 text-center">
                <h2 className="text-3xl font-bold mb-6">Rolling...</h2>
                <RollingDice dice={diceConfig} />
              </div>
            )}

            {results.length > 0 && !isRolling && (
              <div className="bg-white/10 backdrop-blur rounded-2xl p-4 sm:p-8 mb-6">
                <h2 className="text-2xl sm:text-3xl font-bold mb-6 text-center">Results</h2>
                <div className="flex flex-wrap justify-center gap-6 mb-6">
                  {results.map((result, index) => {
                    const isNat20 = result.sides === 20 && result.result === 20;
                    return (
                      <div
                        key={result.id}
                        className={`transform transition-all ${isNat20 ? 'scale-110' : ''}`}
                        style={{
                          animation: `fadeIn 0.5s ease-out ${index * 0.1}s backwards`
                        }}
                      >
                        <div className={`${isNat20 ? 'ring-4 ring-yellow-400 rounded-lg' : ''}`}>
                          <DiceFace sides={result.sides} number={result.result} />
                          {isNat20 && <div className="text-center text-2xl mt-2">🎉</div>}
                        </div>
                      </div>
                    );
                  })}
                </div>
                {isSnakeEyes && (
                  <div className="bg-red-900/40 border-2 border-red-500 rounded-xl p-4 sm:p-6 text-center mb-6">
                    <div className="text-6xl mb-2">🐍</div>
                    <div className="text-2xl font-bold">Snake Eyes!</div>
                  </div>
                )}
                {results.length > 1 && (
                  <div className="bg-white/20 rounded-xl p-4 sm:p-6 text-center mb-6">
                    <div className="text-base sm:text-lg font-semibold mb-1">Total</div>
                    <div className="text-4xl sm:text-5xl font-bold">{total}</div>
                  </div>
                )}
                <div className="flex flex-col sm:flex-row gap-3">
                  <button
                    onClick={rollAgain}
                    className="flex-1 bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-white font-bold py-3 sm:py-4 px-6 sm:px-8 rounded-xl text-lg sm:text-xl transition-all transform hover:scale-105"
                  >
                    Roll These Again
                    <span className="text-xs sm:text-sm block mt-1 opacity-75">(Space/Enter)</span>
                  </button>
                  <button
                    onClick={reconfigure}
                    className="bg-white/20 hover:bg-white/30 font-semibold py-3 sm:py-4 px-4 sm:px-6 rounded-xl transition-all flex items-center justify-center gap-2"
                  >
                    <span className="text-lg">⚙️</span>
                    Reconfigure
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<DiceRoller />);
  </script>
</body>
</html>
